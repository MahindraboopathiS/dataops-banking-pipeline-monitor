name: portfolio-content-validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/screenshots/**'
      - 'docs/screenshots.md'
      - 'docs/local_run_report.md'

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  validate-and-capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository and generate content previews
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import datetime as dt
          import html
          import os
          import subprocess
          import sys
          import textwrap

          repo = os.environ['GITHUB_REPOSITORY'].split('/')[-1]
          root = Path.cwd()
          screenshots = root / 'docs' / 'screenshots'
          screenshots.mkdir(parents=True, exist_ok=True)
          results = []

          def run_step(name: str, cmd: list[str], timeout: int = 300, fail_allowed: bool = False) -> None:
              started = dt.datetime.utcnow()
              try:
                  result = subprocess.run(cmd, cwd=root, text=True, capture_output=True, timeout=timeout)
                  status = 'PASS' if result.returncode == 0 else ('REVIEW' if fail_allowed else 'FAIL')
                  output = (result.stdout or '') + (('\nSTDERR:\n' + result.stderr) if result.stderr else '')
                  results.append({
                      'name': name,
                      'cmd': ' '.join(cmd),
                      'status': status,
                      'exit': result.returncode,
                      'duration': round((dt.datetime.utcnow() - started).total_seconds(), 2),
                      'output': output[-6000:],
                  })
              except subprocess.TimeoutExpired as exc:
                  output = (exc.stdout or '') if isinstance(exc.stdout, str) else str(exc.stdout or '')
                  output += '\nSTDERR:\n' + ((exc.stderr or '') if isinstance(exc.stderr, str) else str(exc.stderr or ''))
                  results.append({
                      'name': name,
                      'cmd': ' '.join(cmd),
                      'status': 'TIMEOUT',
                      'exit': -999,
                      'duration': timeout,
                      'output': output[-6000:],
                  })

          def file_check(path: str) -> None:
              ok = (root / path).exists()
              results.append({
                  'name': f'file:{path}',
                  'cmd': f'test -f {path}',
                  'status': 'PASS' if ok else 'FAIL',
                  'exit': 0 if ok else -1,
                  'duration': 0,
                  'output': 'exists' if ok else 'missing',
              })

          if (root / 'pyproject.toml').exists():
              run_step('pip-upgrade', [sys.executable, '-m', 'pip', 'install', '--upgrade', 'pip'], timeout=300)
              run_step('pip-install-editable-dev', [sys.executable, '-m', 'pip', 'install', '-e', '.[dev]'], timeout=900)

          targets = [p for p in ['src', 'tests', 'dashboard'] if (root / p).exists()]
          if targets:
              run_step('compileall', [sys.executable, '-m', 'compileall', '-q', *targets], timeout=180)
          else:
              results.append({'name': 'compileall', 'cmd': 'no python targets', 'status': 'SKIP', 'exit': 0, 'duration': 0, 'output': ''})

          if (root / 'tests').exists():
              run_step('pytest', [sys.executable, '-m', 'pytest', '-q', '--maxfail=1'], timeout=300)
          else:
              results.append({'name': 'pytest', 'cmd': 'no tests directory', 'status': 'SKIP', 'exit': 0, 'duration': 0, 'output': ''})

          if (root / 'pyproject.toml').exists():
              run_step('ruff', [sys.executable, '-m', 'ruff', 'check', '.'], timeout=180)

          if repo == 'banking-dataops-monitoring':
              run_step('generate-synthetic-data', [sys.executable, '-m', 'banking_dataops.generate_synthetic_data', '--output-dir', 'data', '--customers', '5', '--transactions', '20'], timeout=120)
              run_step('import-check', [sys.executable, '-c', 'import banking_dataops, banking_dataops.quality_checks, banking_dataops.reconciliation; print("imports-ok")'], timeout=120)
          elif repo == 'fraud-mlops-control-tower':
              run_step('generate-synthetic-risk-data', [sys.executable, '-m', 'fraud_mlops.generate_synthetic_risk_data', '--output', 'data/synthetic_risk_events.csv', '--rows', '120'], timeout=120)
              run_step('import-check', [sys.executable, '-c', 'import fraud_mlops, fraud_mlops.features, fraud_mlops.api; print("imports-ok")'], timeout=120)
              run_step('train-small-model', [sys.executable, '-m', 'fraud_mlops.train', '--data', 'data/synthetic_risk_events.csv', '--model', 'artifacts/model.pkl', '--metrics', 'reports/metrics.json'], timeout=300)
          elif repo == 'database-migration-quality-lab':
              run_step('generate-synthetic-legacy-data', [sys.executable, '-m', 'migration_quality.generate_synthetic_legacy_data', '--output-dir', 'data', '--clients', '5', '--accounts', '10'], timeout=120)
              run_step('import-check', [sys.executable, '-c', 'import migration_quality, migration_quality.validate, migration_quality.reconcile; print("imports-ok")'], timeout=120)
          elif repo == 'secure-wealth-rag-assistant':
              run_step('import-check', [sys.executable, '-c', 'import secure_rag, secure_rag.rag_pipeline, secure_rag.guardrails; print("imports-ok")'], timeout=120)
              run_step('rag-demo', [sys.executable, '-m', 'secure_rag.app', "What is the synthetic client's risk profile?"], timeout=120)
          elif repo == 'jedha-rncp35288-portfolio':
              for path in ['README.md', 'PORTFOLIO.md', 'docs/evidence_index.md', 'docs/public_safety_rules.md', 'bloc_1_data_infrastructure/README.md', 'bloc_6_project_governance/README.md']:
                  file_check(path)

          secret_hits = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              parts = set(path.parts)
              if '.git' in parts or '.venv' in parts or '__pycache__' in parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8', errors='ignore').lower()
              except Exception:
                  continue
              if any(token in text for token in ['begin ', 'gho_', 'api_key', 'secret', 'token', 'password']):
                  secret_hits.append(str(path.relative_to(root)))
          results.append({'name': 'secret-keyword-scan', 'cmd': 'scan text files', 'status': 'REVIEW' if secret_hits else 'PASS', 'exit': 0, 'duration': 0, 'output': '\n'.join(secret_hits[:200])})

          def status_icon(status: str) -> str:
              return {'PASS': 'OK', 'FAIL': 'FAIL', 'TIMEOUT': 'TIMEOUT', 'REVIEW': 'REVIEW', 'SKIP': 'SKIP'}.get(status, status)

          lines = ['# Local Run Report', '', f'Generated by GitHub Actions on {dt.datetime.utcnow().isoformat(timespec="seconds")}Z', '', '| Step | Status | Exit | Duration |', '|---|---:|---:|---:|']
          for r in results:
              lines.append(f"| {r['name']} | {r['status']} | {r['exit']} | {r['duration']}s |")
          lines += ['', '## Detailed outputs', '']
          for r in results:
              lines += [f"### {r['name']} - {r['status']}", '', '```text', f"$ {r['cmd']}", '', r['output'] or '(no output)', '```', '']
          (root / 'docs' / 'local_run_report.md').write_text('\n'.join(lines), encoding='utf-8')

          summary_text = '\n'.join(f"{r['name']}: {r['status']} exit={r['exit']}" for r in results)
          svg_lines = summary_text.splitlines()[:28]
          y = 90
          text_nodes = []
          for line in svg_lines:
              safe = html.escape(line[:115])
              text_nodes.append(f'<text x="60" y="{y}" class="mono">{safe}</text>')
              y += 26
          svg = f'''<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{html.escape(repo)} validation preview">
          <defs><style>.title{{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:750;fill:#fff}}.sub{{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;fill:#9FB3C8}}.mono{{font-family:Consolas,Menlo,monospace;font-size:18px;fill:#D8E2F0}}</style></defs>
          <rect width="1280" height="900" rx="26" fill="#07111F"/>
          <text x="60" y="52" class="title">{html.escape(repo)}</text>
          <text x="60" y="78" class="sub">Generated from real validation commands in GitHub Actions</text>
          {''.join(text_nodes)}
          </svg>'''
          (screenshots / 'validation-preview.svg').write_text(svg, encoding='utf-8')

          html_report = '<!doctype html><html><head><meta charset="utf-8"><title>Validation</title><style>body{background:#07111F;color:#D8E2F0;font-family:Segoe UI,Arial,sans-serif;padding:40px}pre{background:#0B1F3A;border:1px solid #24415F;border-radius:14px;padding:20px;white-space:pre-wrap}h1,h2{color:#fff}</style></head><body>'
          html_report += f'<h1>{html.escape(repo)}</h1><h2>Validation output generated from repository commands</h2>'
          for r in results:
              html_report += f'<h3>{html.escape(r["name"])} - {html.escape(r["status"])}</h3><pre>{html.escape(r["cmd"] + chr(10) + chr(10) + (r["output"] or "(no output)"))}</pre>'
          html_report += '</body></html>'
          (screenshots / 'validation-output.html').write_text(html_report, encoding='utf-8')

          index = '# Screenshots and content previews\n\nGenerated from real repository validation commands in GitHub Actions.\n\n- [validation-preview.svg](screenshots/validation-preview.svg)\n- [validation-output.html](screenshots/validation-output.html)\n'
          (root / 'docs' / 'screenshots.md').write_text(index, encoding='utf-8')

          failed = [r for r in results if r['status'] in {'FAIL', 'TIMEOUT'}]
          if failed:
              Path('validation_failed.flag').write_text('\n'.join(r['name'] for r in failed), encoding='utf-8')
          PY

      - name: Commit generated reports and previews
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/local_run_report.md docs/screenshots.md docs/screenshots || true
          if git diff --cached --quiet; then
            echo "No generated report changes to commit."
          else
            git commit -m "docs: update generated validation report and previews [skip ci]"
            git push
          fi

      - name: Fail if validation failed
        shell: bash
        run: |
          if [ -f validation_failed.flag ]; then
            echo "Validation failed steps:"
            cat validation_failed.flag
            exit 1
          fi

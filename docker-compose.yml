services:
  postgres:
    image: postgres:16
    container_name: banking-dataops-postgres
    environment:
      POSTGRES_USER: dataops
      POSTGRES_PASSWORD: dataops_local_only
      POSTGRES_DB: banking_dataops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataops -d banking_dataops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

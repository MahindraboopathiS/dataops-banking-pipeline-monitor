<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data Quality Controls">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:38px;font-weight:750;fill:#fff}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;fill:#D8E2F0}
      .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#B8C7D9}
      .chip{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:650;fill:#fff}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#9FB3C8}
    </style>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect x="36" y="36" width="1208" height="288" rx="22" stroke="#2EA043" stroke-width="2" opacity="0.55"/>
  <circle cx="1120" cy="102" r="70" stroke="#2EA043" stroke-width="2" opacity="0.25"/>
  <circle cx="1190" cy="205" r="48" stroke="#2EA043" stroke-width="2" opacity="0.22"/>
  <path d="M1050 245 C1105 185 1140 240 1216 162" stroke="#A371F7" stroke-width="4" opacity="0.3" fill="none"/>
  <text x="64" y="84" class="title">Data Quality Controls</text>
  <text x="64" y="116" class="sub">SQL-backed checks for regulated-data production support</text>
  <text x="64" y="150" class="body">critical_nulls: required fields present</text><text x="64" y="178" class="body">duplicate_transactions: transaction_id uniqueness</text><text x="64" y="206" class="body">invalid_amounts: range validation</text><text x="64" y="234" class="body">orphan_transactions: referential integrity</text><text x="64" y="262" class="body">freshness: latest event timestamp</text>
  <rect x="64" y="246" width="110" height="34" rx="17" fill="#0D419D" opacity="0.95"/><text x="82" y="268" class="chip">CTRL-001</text><rect x="190" y="246" width="110" height="34" rx="17" fill="#1A7F37" opacity="0.95"/><text x="208" y="268" class="chip">CTRL-002</text><rect x="316" y="246" width="110" height="34" rx="17" fill="#6E40C9" opacity="0.95"/><text x="334" y="268" class="chip">CTRL-003</text><rect x="442" y="246" width="110" height="34" rx="17" fill="#BF8700" opacity="0.95"/><text x="460" y="268" class="chip">CTRL-004</text>
  <text x="64" y="318" class="small">Sanitized visual preview - synthetic/public data only - no private material.</text>
</svg>
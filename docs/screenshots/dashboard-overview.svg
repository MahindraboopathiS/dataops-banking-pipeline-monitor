      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:38px;font-weight:750;fill:#fff}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;fill:#D8E2F0}
      .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#B8C7D9}

<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banking DataOps validation output">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="860" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#07111F"/><stop offset="0.62" stop-color="#0B1F3A"/><stop offset="1" stop-color="#102A43"/></linearGradient>
    <style>.title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:38px;font-weight:750;fill:#fff}.sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;fill:#D8E2F0}.mono{font-family:Consolas,Menlo,monospace;font-size:18px;fill:#D8E2F0}.small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#9FB3C8}.badge{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:650;fill:#fff}</style>
  </defs>
  <rect width="1400" height="860" rx="28" fill="url(#bg)"/>
  <rect x="42" y="42" width="1316" height="776" rx="22" stroke="#58A6FF" stroke-width="2" opacity="0.55"/>
  <text x="72" y="88" class="title">Banking DataOps - validation output</text>
  <text x="72" y="122" class="sub">Local validation commands for synthetic regulated-data monitoring</text>
  <rect x="1120" y="68" width="184" height="32" rx="16" fill="#1A7F37"/><text x="1142" y="90" class="badge">public evidence</text>
  <text x="72" y="162" class="mono">python -m compileall -q src tests dashboard</text>
  <text x="72" y="190" class="mono">python -m pytest -q --maxfail=1</text>
  <text x="72" y="218" class="mono">python -m ruff check .</text>
  <text x="72" y="258" class="mono">python -m banking_dataops.generate_synthetic_data --output-dir data --customers 5 --transactions 20</text>
  <text x="72" y="286" class="mono">Expected output: synthetic customers, accounts and transactions generated locally.</text>
  <text x="72" y="326" class="mono">docker compose up -d</text>
  <text x="72" y="354" class="mono">python -m banking_dataops.ingest</text>
  <text x="72" y="382" class="mono">python -m banking_dataops.quality_checks</text>
  <text x="72" y="410" class="mono">python -m banking_dataops.reconciliation</text>
  <text x="72" y="458" class="mono">Validated evidence target:</text>
  <text x="92" y="486" class="mono">- PostgreSQL schema</text>
  <text x="92" y="514" class="mono">- SQL quality controls</text>
  <text x="92" y="542" class="mono">- reconciliation summaries</text>
  <text x="92" y="570" class="mono">- Streamlit dashboard</text>
  <text x="92" y="598" class="mono">- incident runbook</text>
  <text x="72" y="824" class="small">Generated from repository validation plan. Synthetic/public data only. No credentials.</text>
</svg>
